name: Supabase keep-alive
# Pings Supabase once a day so the free project is never paused for inactivity.
# The URL and anon (public) key are read from js/config.js, so no GitHub secrets are needed.
on:
  schedule:
    - cron: "30 3 * * *"   # every day at 09:00 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL: '\([^']*\)'.*/\1/p" js/config.js | tr -d '[:space:]')
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY: '\([^']*\)'.*/\1/p" js/config.js | tr -d '[:space:]')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Could not read SUPABASE_URL / SUPABASE_ANON_KEY from js/config.js"; exit 1; fi
          echo "Pinging ${URL}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 10 \
            "${URL}/rest/v1/subjects?select=id&limit=1" \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}")
          echo "Supabase answered HTTP ${CODE}"
          [ "${CODE}" = "200" ] || { echo "Ping failed. If the project is paused, restore it in the Supabase dashboard."; exit 1; }
